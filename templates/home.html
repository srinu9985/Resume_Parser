<!DOCTYPE html>
<html>
<head>
    <title>Home Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: url('https://i.pinimg.com/originals/88/4d/e8/884de81d29f37619ff17935475764213.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
        }

        h1 {
            margin-top: 50px; /* Adjust the margin to position the text at the top */
        }

        .button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        a {
            text-decoration: none;
        }

        button {
            background-color: #0074d9;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .heading-wrapper {
            padding: 10px;
            border-radius: 5px;
            margin: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .heading {
            text-align: center;
            max-width: 80%;
            padding: 5px;
            border-radius: 5px;
            font-weight: bold;
        }

        .paragraph {
            margin: 390px;
            font-size: 18px;
        }

        .footer {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="heading-wrapper">
        <h1 class="heading">RESUME PARSER </h1>
    </div>

    <div class="button-container">
        <a href="/login"><button>Login</button></a>
        <a href="/register"><button>Register</button></a>
    </div>

    <div class="paragraph">
        Developed using 30,000 resumes.
    </div>

    <div class="footer">
        Developed by HGTKKD Team (Manoj, Adarsh, Srinu, Grace) under the guidance of Rajaramesh Sir
    </div>
</body>
</html>
